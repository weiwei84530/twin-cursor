[project]
name = "twincursor"
version = "1.1.0"
description = "A dual-mouse, dual-cursor tool for Windows, designed for ambidextrous users"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pillow>=10.2.0",
    "pywin32>=308",
    "pystray>=0.19.5",
    "interception-python",
]

[tool.uv.sources]
interception-python = { path = "interception_python-1.13.5" }

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]
